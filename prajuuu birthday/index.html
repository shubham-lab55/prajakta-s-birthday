<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Prajuuu 💖</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="petal-container"></div>
    <div id="heart-container"></div>

    <div class="balloon" style="left:10%">🎈</div>
    <div class="balloon" style="left:30%">🎈</div>
    <div class="balloon" style="left:50%">🎈</div>
    <div class="balloon" style="left:70%">🎈</div>
    <div class="balloon" style="left:90%">🎈</div>

    <h1>🎂 Happy Birthday Prajuuu 🌸</h1>

    <div class="glass-card">

        <h2>A Special Letter Has Arrived 💌</h2>

        <div class="envelope" onclick="openLetter()">
            💌
            <p>Click Me Prajuuu 💖</p>
        </div>

    </div>

    <div id="letter" class="letter">

        <h2>Dear Prajuuu 🌸</h2>

        <p id="typewriter"></p>

    </div>

    <div class="glass-card gallery-card">

        <h2>🎁 A Little Birthday Surprise 🎁</h2>

        <img id="slide" src="images/prajuu 1.jpeg" alt="Memory">
        <p id="caption">
            The cutest smile 💖
        </p>

    </div>

    <div class="glass-card">

        <h2>🎵 Birthday Music</h2>

        <audio controls>
            <source src="music/birthday.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
